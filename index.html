<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="description" content="Tracker personal de gimnasio: rutinas, pesos por serie, descanso y progreso.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maddox Gym">
<style>html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Maddox Gym</title>
<meta name="theme-color" content="#090A0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=Inter:wght@300;400;500;600&display=swap">
<style>
/* Layout: una columna móvil; arriba un haz de aurora (azul → coral) sobre negro que se apaga en grafito; tarjetas carbón con borde fino; controles en píldora; Sora para cifras y títulos */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{
  --void:#090A0C;--canvas:#303236;--card:#111111;--card2:#18191C;--edge:#4A4B50;--edge-soft:rgba(149,151,158,.22);
  --fg:#FFFFFF;--ash:#A9A9AA;--smoke:#95979E;--iron:#6B6C6D;
  --iris:#5683DA;--iris-press:#4670C4;--iris-12:rgba(86,131,218,.12);--iris-24:rgba(86,131,218,.24);
  --ember:#FF8964;--ember-12:rgba(255,137,100,.12);--molasses:#5A250A;--sun:#FFAA81;--sun2:#FFDA9F;
  --muted:var(--ash);--faint:var(--smoke);--accent:var(--iris);--accent-hi:#86A6E6;--err:var(--ember);
  --sh-md:0 4px 16px rgba(0,0,0,.35);--sh-xl:0 6px 25px rgba(0,0,0,.5);
  --p25:#D93A33;--p20:#2F6FD1;--p15:#E3B321;--p10:#3E9A5A;--p5:#E8E8E8;--p2:#5A5E64;
  --display:'Sora','General Sans',ui-sans-serif,system-ui,sans-serif;
  --body:'Inter','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease-out:cubic-bezier(0.23,1,0.32,1);--ease-drawer:cubic-bezier(0.32,0.72,0,1);--ease-spring:cubic-bezier(.34,1.4,.64,1);
  color-scheme:dark;
}
html{background:var(--canvas);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{background-color:var(--canvas);color:var(--ash);font-family:var(--body);font-size:14px;line-height:1.5;letter-spacing:-.01em;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(112px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%;overflow-x:hidden;min-height:100%;position:relative}
body.has-dock{padding-bottom:calc(196px + env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box}

/* Aurora: aparece una sola vez, arriba */
.bgfx{position:absolute;left:0;right:0;top:0;height:880px;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,var(--void) 0%,var(--void) 52%,var(--canvas) 100%)}
.bgfx i{position:absolute;will-change:transform,opacity}
.bgfx .o1{left:58%;top:-80px;width:min(36vw,190px);height:560px;transform:translateX(-50%);border-radius:50%;filter:blur(30px);opacity:1;background:linear-gradient(180deg,rgba(86,131,218,.15) 0%,rgba(86,131,218,.95) 32%,var(--ember) 72%,#FFE9DA 94%)}
.bgfx .o2{left:58%;top:330px;width:420px;height:300px;transform:translateX(-50%);border-radius:50%;filter:blur(30px);opacity:.55;background:radial-gradient(closest-side,var(--sun) 0%,rgba(255,218,159,.45) 45%,rgba(255,218,159,0) 100%)}
.bgfx .o3{display:none}
.bgfx .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px;-webkit-mask-image:radial-gradient(ellipse 80% 55% at 52% 30%,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse 80% 55% at 52% 30%,#000 10%,transparent 75%)}
.wrap{max-width:560px;margin:0 auto;position:relative;z-index:1}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}

button{font:inherit;color:inherit;letter-spacing:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform 140ms var(--ease-out),background-color 160ms ease,border-color 160ms ease,color 160ms ease,box-shadow 200ms ease}
button:not(:disabled):active{transform:scale(.96)}
.h-card:active,.resume:active{transform:scale(.985)}
:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(255,255,255,.4)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:18px 8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-.04em;line-height:1;color:var(--fg)}
.brand b{color:var(--smoke);font-weight:500}
.logo{width:28px;height:28px;border-radius:9px;background:conic-gradient(from 200deg,var(--iris),var(--ember),var(--iris));position:relative;flex:none}
.logo::after{content:"";position:absolute;inset:3px;border-radius:7px;background:var(--void)}
.logo::before{content:"";position:absolute;inset:9px;border-radius:50%;background:linear-gradient(180deg,var(--iris),var(--ember));z-index:1}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--smoke);padding:5px 11px;border-radius:9999px;border:1px solid var(--edge-soft);background:rgba(9,10,12,.6)}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--iron)}
.sync.on i{background:var(--iris);box-shadow:0 0 8px var(--iris)}
h1.page{font-family:var(--display);font-weight:600;font-size:34px;letter-spacing:-.045em;line-height:1;color:var(--fg);margin:18px 0 16px;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.03em;line-height:1.2;color:var(--fg);margin:28px 0 12px}
.eyebrow{font-weight:500;font-size:12px;letter-spacing:0;color:var(--smoke);display:inline-flex;align-items:center;gap:6px}
.muted{color:var(--ash)}.faint{color:var(--smoke)}.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* Tarjetas */
.card,.stat,.tile,.h-card,.seg,.notice{background:var(--card);border:1px solid var(--edge-soft)}
.card{border-radius:12px;padding:18px;position:relative;overflow:hidden}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sb{justify-content:space-between}
.glow-e::after,.glow-i::after{content:"";position:absolute;width:260px;height:260px;right:-110px;top:-120px;border-radius:50%;pointer-events:none;opacity:.5;background:radial-gradient(closest-side,var(--sun) 0%,rgba(255,218,159,.35) 45%,rgba(255,218,159,0) 100%)}
.glow-i::after{background:radial-gradient(closest-side,rgba(86,131,218,.75) 0%,rgba(86,131,218,.2) 50%,rgba(86,131,218,0) 100%)}

/* Botones píldora */
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:9999px;border:0;background:var(--iris);color:#fff;font-weight:500;font-size:15px;letter-spacing:-.01em}
.btn:active{background:var(--iris-press)}
.btn.ghost{background:transparent;border:1px solid var(--edge);color:var(--fg)}
.btn.ghost:active{background:#fff;color:var(--void)}
.btn.sm{min-height:38px;padding:0 16px;font-size:14px}
.btn.wide{width:100%}
.btn.danger{background:var(--ember-12);border:1px solid var(--ember);color:var(--ember)}
.btn svg.i{fill:currentColor;stroke:none;width:13px;height:13px}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);transform:scale(0);opacity:1;pointer-events:none;z-index:-1;animation:ripple 560ms var(--ease-out) forwards}
@keyframes ripple{to{transform:scale(1);opacity:0}}
.link{background:none;border:0;padding:4px 0;color:var(--accent-hi);font-weight:500;font-size:13px}
.icon-btn{min-width:38px;height:38px;padding:0 10px;border-radius:9999px;border:1px solid var(--edge);background:transparent;color:var(--ash);font-size:14px;line-height:1;flex:none}
.icon-btn:disabled{opacity:.3}
.play{position:relative;overflow:hidden;width:40px;height:40px;border-radius:50%;border:0;background:var(--iris);color:#fff;display:grid;place-items:center;flex:none}
.play svg{width:13px;height:13px;fill:currentColor;stroke:none;margin-left:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:5px 12px;border-radius:9999px;background:var(--iris-12);border:0;color:var(--accent-hi)}
.chip.on{background:var(--iris);color:#fff}
textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--void);border:1px solid var(--edge);border-radius:6px;padding:10px 12px;width:100%;min-height:120px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:16px;line-height:1.4}
textarea:focus{outline:none;border-color:var(--iris);box-shadow:0 0 0 4px var(--iris-24)}
input,select{font:inherit;font-size:16px;letter-spacing:-.01em;color:var(--fg);background:var(--void);border:1px solid var(--edge);border-radius:6px;padding:0 12px;height:48px;width:100%;min-width:0;transition:border-color 160ms ease,box-shadow 200ms ease}
input:focus,select:focus{outline:none;border-color:var(--iris);box-shadow:0 0 0 4px var(--iris-24)}
input::placeholder{color:var(--iron)}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ash)}
.notice{margin:6px 0;padding:10px 12px;border-radius:12px;font-size:13px}
.err{color:var(--ember);font-size:13px;margin:0}
.err:empty{display:none}
.rec{font-size:11px;font-weight:600;padding:3px 10px;border-radius:9999px;background:var(--ember-12);color:var(--ember);flex:none;letter-spacing:0}
.empty{text-align:center;padding:36px 12px}
.empty .btn{margin-top:14px}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--edge-soft);color:var(--fg)}
.line:first-child{border-top:0}

/* Foco que sigue al dedo */
.gloss{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:0}
.gloss::before{content:"";position:absolute;inset:0;background:radial-gradient(240px circle at var(--gx,50%) var(--gy,0%),rgba(86,131,218,.22),rgba(255,137,100,.08) 45%,transparent 70%);opacity:0;transition:opacity 300ms ease}
.lit .gloss::before{opacity:1}
.tilt>*:not(.gloss){position:relative;z-index:1}

/* Panel principal con trazo de luz */
.hero,.sess{position:relative;border-radius:30px;background:rgba(17,17,17,.72);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--edge-soft);box-shadow:var(--sh-xl);color:#fff}
.hero{padding:26px 20px 20px;margin-top:22px}
.hero::after,.sess::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;background:conic-gradient(from var(--ang),transparent 0deg,transparent 210deg,var(--iris) 280deg,var(--ember) 330deg,transparent 360deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.hero .kicker,.sess .kicker{color:var(--ember);font-weight:500;font-size:13px}
.hero-t{font-family:var(--display);font-weight:600;font-size:40px;letter-spacing:-.05em;line-height:.95;margin:8px 0 12px;text-wrap:balance;color:#fff}
.hero-m{color:var(--ash);font-size:14px;display:flex;align-items:center;gap:6px}
.hero-m b{color:#fff;font-weight:500}
.hero p{color:var(--ash)}
.hero .btn{margin-top:20px;width:100%;min-height:52px;font-size:15px;background:#fff;color:var(--void);font-weight:600}
.hero .btn:active{background:#E5E5E7}
.hero .btn .ripple{background:rgba(86,131,218,.25)}
.hero .btn.ghost{background:transparent;color:#fff;border:1px solid var(--edge);margin-top:10px}
.hero .stat{background:rgba(9,10,12,.6)}
.hero .row .btn{width:auto;margin-top:0}
.prop{display:none}
.resume{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--iris-12);border:1px solid var(--iris-24);border-radius:9999px;padding:8px 18px 8px 8px;margin:12px 0 4px;color:var(--fg)}
.resume b{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

/* Meta semanal */
.goal{display:flex;align-items:center;gap:16px;margin:12px 0 18px}
.goal-r{width:68px;height:68px;transform:rotate(-90deg);flex:none}
.goal-r circle{fill:none;stroke-width:5}
.goal-bg{stroke:#24262A}
.goal-fg{stroke:url(#ge);stroke:var(--iris);stroke-linecap:round;stroke-dasharray:100}
.wk-count{font-size:14px}
.wk-count b{font-family:var(--display);font-weight:600;font-size:34px;color:var(--fg);letter-spacing:-.05em;margin-right:6px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.wkd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--smoke)}
.dot{width:32px;height:32px;border-radius:50%;border:1px solid var(--edge);display:grid;place-items:center;color:#fff;background:transparent}
.dot svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.6}
.wkd.plan .dot{border-color:var(--iris);border-style:dashed}
.wkd.done .dot{background:var(--iris);border:0;box-shadow:0 0 14px rgba(86,131,218,.55)}
.wkd.today{color:var(--fg);font-weight:500}
.wkd .td{width:4px;height:4px;border-radius:50%;background:transparent}
.wkd.today .td{background:var(--ember)}
.row-link{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--edge-soft);margin-top:16px;padding:14px 0 0;text-align:left;font-size:14px;color:var(--fg)}
.row-link span{flex:1}

/* Cuadros */
.bento{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.tile{position:relative;border-radius:12px;padding:14px 12px;display:flex;flex-direction:column;gap:4px;min-height:116px}
.tile .ti{width:30px;height:30px;border-radius:9999px;display:grid;place-items:center;margin-bottom:auto;border:1px solid var(--edge);color:var(--smoke)}
.tile:nth-child(2) .ti{color:var(--ember);border-color:rgba(255,137,100,.35)}
.tile b{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:-.05em;line-height:1;color:var(--fg);font-variant-numeric:tabular-nums;margin-top:10px}
.tile b small{font-size:13px;font-weight:500;color:var(--smoke);letter-spacing:0}
.tile>span:last-child{font-size:11px;line-height:1.35;color:var(--smoke)}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.big-n{font-family:var(--display);font-weight:600;font-size:34px;letter-spacing:-.05em;line-height:1;margin-top:10px;font-variant-numeric:tabular-nums;color:var(--fg);white-space:nowrap}
.big-n small{font-size:16px;font-weight:500;margin-left:3px;letter-spacing:0;color:var(--ash)}
.recard .eyebrow{color:var(--ember)}
.recard>div:nth-child(3){color:var(--fg);font-weight:500;margin-top:10px!important}
.greencard .eyebrow{color:var(--accent-hi)}
.bars{display:flex;align-items:flex-end;gap:5px;height:44px;margin-top:14px}
.bars span{flex:1;max-width:12px;border-radius:9999px;background:#2A2C31;min-height:6px;transform-origin:bottom}
.bars span:last-child{background:linear-gradient(180deg,var(--ember),var(--iris))}
.rlist .rl{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--edge-soft)}
.rlist .rl:first-child{border-top:0}
.rl .t{font-weight:500;font-size:15px;color:var(--fg)}
.rl .m{font-size:12px;color:var(--smoke)}
.rl>div{flex:1;min-width:0}

/* Rutinas */
.rut-name{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.04em;line-height:1.1;color:var(--fg)}
.wkrow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--edge-soft)}
.wkrow:first-of-type{border-top:0}
.wkrow .d{font-weight:500;color:var(--smoke)}
.wkrow.today .d{color:var(--ember)}

/* Entrenar */
.sess{text-align:center;padding:24px 18px 20px;margin-top:22px}
.sess .faint,.sess .muted{color:var(--ash)}
.clock{font-family:var(--display);font-weight:600;font-size:74px;line-height:1;letter-spacing:-.06em;font-variant-numeric:tabular-nums;margin:10px 0 6px;color:#fff}
.clock.paused{color:var(--iron)}
.sess .row{justify-content:center;margin-top:16px}
.sess .btn{background:#fff;color:var(--void)}
.sess .btn.ghost{background:transparent;color:#fff;border:1px solid var(--edge)}
.sess .btn.danger{background:var(--ember-12);color:var(--ember);border:1px solid var(--ember)}
.meter{height:6px;border-radius:9999px;background:#24262A;overflow:hidden;margin-top:20px}
.meter i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--iris),var(--ember));border-radius:9999px;transform-origin:left center;transition:transform 420ms var(--ease-spring)}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-name{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.2;letter-spacing:-.03em;color:var(--fg)}
.ex .muted.small{margin-top:3px}
.sug{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 12px 12px 16px;border-radius:12px;background:var(--card2);border:1px solid var(--edge-soft)}
.sug.lift{background:linear-gradient(100deg,rgba(86,131,218,.16),rgba(255,137,100,.08));border-color:rgba(86,131,218,.4)}
.sug>div{flex:1;min-width:0}
.sug .k{font-weight:500;font-size:12px;color:var(--ember)}
.sug .t{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:-.04em;line-height:1.15;color:var(--fg)}
.sug .d{font-size:13px}
.sets{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.set,.set-h{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 48px;gap:8px;align-items:center}
.set-h{font-size:11px;color:var(--smoke);text-align:center}
.set .n{font-family:var(--display);font-weight:600;font-size:16px;color:var(--iron);text-align:center;transition:color 200ms ease}
.set input{text-align:center;font-variant-numeric:tabular-nums;font-weight:500}
.chk{position:relative;overflow:hidden;width:48px;height:48px;border-radius:9999px;border:1px solid var(--edge);background:transparent;color:var(--iron);display:grid;place-items:center}
.chk svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.6;transition:transform 260ms var(--ease-spring)}
.set:not(.ok) .chk svg{transform:scale(.75)}
.set.ok .chk{background:var(--iris);border-color:var(--iris);color:#fff;box-shadow:0 0 16px rgba(86,131,218,.5)}
.set.ok .n{color:var(--accent-hi)}
.set.ok input{color:var(--ash);border-color:#2A2C31}
.set.isPR .n{color:var(--ember)}
.ex .row{margin-top:10px}
.sumrecs{display:flex;flex-direction:column;gap:8px;margin-top:12px}

/* Descanso */
#dock{position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:19;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.dock-in{max-width:540px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 8px;border-radius:9999px;background:rgba(17,17,17,.86);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--edge);box-shadow:var(--sh-xl);transition:background-color 240ms ease,border-color 240ms ease}
.dock-in.done{background:var(--iris);border-color:var(--iris)}
.dock-in.done .eyebrow,.dock-in.done .small,.dock-in.done .ring-t{color:#fff}
.dock-in.done .ring-bg{stroke:rgba(255,255,255,.25)}
.dock-in.done .ring-fg{stroke:#fff}
.dock-in.done .icon-btn{border-color:rgba(255,255,255,.6);color:#fff}
.ringw{position:relative;width:54px;height:54px;flex:none}
.ringw svg{width:54px;height:54px;transform:rotate(-90deg)}
.ringw circle{fill:none;stroke-width:4}
.ring-bg{stroke:#24262A}
.ring-fg{stroke:var(--ember);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring-t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--fg)}
.dock-txt{flex:1;min-width:0}
.dock-txt .eyebrow{color:var(--ember)}
.dock-txt .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ash)}
.dock-act{display:flex;gap:4px}
.dock-act .icon-btn{height:38px;min-width:38px;font-size:12px;font-weight:500;color:var(--fg)}

/* Progreso */
.seg{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:9999px;margin-bottom:14px}
.seg button{height:38px;border-radius:9999px;border:0;background:transparent;color:var(--smoke);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--void)}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:8px;scrollbar-width:none;scroll-snap-type:x proximity}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{white-space:nowrap;flex:none;padding:8px 15px;font-size:13px;scroll-snap-align:start}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{position:relative;border-radius:12px;padding:14px;overflow:hidden}
.stat b{display:block;font-family:var(--display);font-weight:600;font-size:28px;letter-spacing:-.05em;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--fg)}
.stat b small{font-size:14px;font-weight:500;color:var(--smoke);letter-spacing:0}
.stat>span{font-size:12px;color:var(--smoke)}
.stat.hl{border-color:rgba(255,137,100,.4)}
.stat.hl::after{content:"";position:absolute;width:200px;height:200px;right:-90px;top:-100px;border-radius:50%;pointer-events:none;opacity:.45;background:radial-gradient(closest-side,var(--sun),rgba(255,218,159,0))}
.stat.hl b{color:var(--fg)}
.hero .stat.hl{border-color:rgba(255,137,100,.4)}
.up{color:var(--accent-hi)!important}.down{color:var(--ember)!important}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.cline{stroke-dasharray:1;stroke-dashoffset:0}
.cpt{transform-box:fill-box;transform-origin:center}
.bar{display:flex;align-items:center;gap:2px;height:64px;margin:8px 0}
.bar .shaft{height:6px;width:46px;background:#6B6C6D;border-radius:2px}
.bar .sleeve{height:12px;width:10px;background:#6B6C6D;border-radius:2px}
.bar .pl{width:11px;border-radius:3px}
.hist-sets{font-size:13px;color:var(--ash);font-variant-numeric:tabular-nums;text-align:right}
.h-card{position:relative;width:100%;text-align:left;border-radius:12px;padding:16px;display:block}
.h-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ash);margin-top:6px;font-variant-numeric:tabular-nums}
.h-detail{display:flex;flex-direction:column;gap:10px;border-top-left-radius:0;border-top-right-radius:0;margin-top:-1px}

/* Perfil */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--edge-soft)}
.set-row:first-child{border-top:0;padding-top:2px}
.set-row .t{font-weight:500;color:var(--fg)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.04em;min-width:20px;text-align:center;color:var(--fg)}
.switch{width:50px;height:30px;border-radius:9999px;border:1px solid var(--edge);background:var(--void);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--smoke);transition:transform 320ms var(--ease-spring),background-color 200ms ease}
.switch[aria-pressed="true"]{background:var(--iris);border-color:var(--iris)}
.switch[aria-pressed="true"]::after{transform:translateX(20px);background:#fff}
.credit{text-align:center;font-size:12px;color:var(--smoke);margin-top:26px}

/* Editor */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(9,10,12,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--card);border-top:1px solid var(--edge);border-radius:30px 30px 0 0;width:100%;max-width:600px;max-height:92%;overflow-y:auto;overscroll-behavior:contain;box-shadow:var(--sh-xl);padding-block:12px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-in::before{content:"";display:block;width:40px;height:4px;border-radius:9px;background:var(--edge);margin:0 auto 14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-head h2{margin:0;font-size:24px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day{height:42px;border-radius:9999px;border:1px solid var(--edge);background:transparent;font-size:12px;color:var(--ash)}
.day[aria-pressed="true"]{background:var(--iris);border-color:var(--iris);color:#fff;font-weight:500}
.lbl{font-size:13px;margin:16px 0 8px}
.ed-item{background:var(--card2);border:1px solid var(--edge-soft);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ed-r1{display:flex;gap:6px}
.ed-r2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:6px}
.ed-r2 input,.ed-r2 select{height:44px;font-size:16px}
.sheet-foot{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:18px}

/* Barra flotante */
.tabs{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:540px;margin:0 auto;z-index:20;border-radius:9999px;background:rgba(17,17,17,.82);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--edge);box-shadow:var(--sh-xl);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:0 6px}
.tab-ind{position:absolute;left:0;top:8px;width:58px;height:50px;border-radius:9999px;background:#fff;transition:transform 460ms var(--ease-spring),opacity 200ms ease;pointer-events:none}
.tabs button{background:none;border:0;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;color:var(--smoke);position:relative;z-index:1}
.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--void)}
.tabs .mid .orb{position:relative;width:50px;height:50px;border-radius:50%;background:var(--iris);color:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 22px rgba(86,131,218,.55)}
.tabs .mid{font-size:0;gap:0}
.tabs .mid .orb svg{stroke:#fff;width:23px;height:23px}
.tabs .mid[aria-current="page"] .orb{background:linear-gradient(135deg,var(--iris),var(--ember))}
.tabs .live{position:absolute;top:9px;right:calc(50% - 26px);width:10px;height:10px;border-radius:50%;background:var(--ember);box-shadow:0 0 0 3px #111;z-index:2}

@media (prefers-reduced-motion:no-preference){
  .bgfx .o1{animation:beam 7s ease-in-out infinite alternate}
  @keyframes beam{to{opacity:.7;transform:translateX(-50%) scaleX(1.3)}}
  .bgfx .o2{animation:sun 9s ease-in-out infinite alternate}
  @keyframes sun{to{opacity:.35;transform:translateX(-50%) scale(1.12)}}
  .hero::after,.sess::after{animation:spin 6s linear infinite}
  @keyframes spin{to{--ang:360deg}}
  .tabs .live{animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{50%{transform:scale(1.3)}}
  .enter>*{animation:rise 520ms var(--ease-out) both}
  .enter>*:nth-child(2){animation-delay:50ms}.enter>*:nth-child(3){animation-delay:100ms}.enter>*:nth-child(4){animation-delay:150ms}
  .enter>*:nth-child(5){animation-delay:200ms}.enter>*:nth-child(6){animation-delay:250ms}.enter>*:nth-child(7){animation-delay:300ms}.enter>*:nth-child(n+8){animation-delay:340ms}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}}
  .enter .duo>*,.enter .bento>*{animation:rise 520ms var(--ease-out) both}
  .enter .bento>*:nth-child(2),.enter .duo>*:nth-child(2){animation-delay:90ms}.enter .bento>*:nth-child(3){animation-delay:180ms}
  .enter .bars span{animation:grow 760ms var(--ease-spring) both}
  .enter .bars span:nth-child(2){animation-delay:60ms}.enter .bars span:nth-child(3){animation-delay:120ms}.enter .bars span:nth-child(4){animation-delay:180ms}.enter .bars span:nth-child(5){animation-delay:240ms}.enter .bars span:nth-child(6){animation-delay:300ms}
  @keyframes grow{from{transform:scaleY(0)}}
  .enter .goal-fg{animation:ring 1.1s var(--ease-out) .2s both}
  @keyframes ring{from{stroke-dashoffset:100}}
  .enter .wkd.done .dot{animation:pop 480ms var(--ease-spring) both}
  .enter .wkd:nth-child(2) .dot{animation-delay:40ms}.enter .wkd:nth-child(3) .dot{animation-delay:80ms}.enter .wkd:nth-child(4) .dot{animation-delay:120ms}.enter .wkd:nth-child(5) .dot{animation-delay:160ms}.enter .wkd:nth-child(6) .dot{animation-delay:200ms}.enter .wkd:nth-child(7) .dot{animation-delay:240ms}
  @keyframes pop{from{transform:scale(.4);opacity:0}}
  .enter .cline{animation:draw 1.2s var(--ease-out) .15s both}
  @keyframes draw{from{stroke-dashoffset:1}}
  .enter .carea{animation:fadeIn .9s ease .5s both}
  @keyframes fadeIn{from{opacity:0}}
  .enter .cpt{animation:pop 420ms var(--ease-spring) both}
  .sheet.enter{animation:fadeIn 220ms ease}
  .sheet.enter .sheet-in{animation:sheetUp 380ms var(--ease-drawer)}
  @keyframes sheetUp{from{transform:translateY(100%)}}
  .dock-in.enter{animation:dockIn 340ms var(--ease-spring)}
  @keyframes dockIn{from{transform:translateY(24px) scale(.94);opacity:0}}
  .set.ok .chk{animation:tickPop 380ms var(--ease-spring)}
  @keyframes tickPop{40%{transform:scale(1.12)}}
  .celebrate{animation:celebrate 640ms var(--ease-spring) both}
  @keyframes celebrate{from{transform:scale(.92) translateY(20px);opacity:0}}
  .celebrate .sumrecs .row{animation:rise 420ms var(--ease-out) both}
  .celebrate .sumrecs .row:nth-child(2){animation-delay:80ms}.celebrate .sumrecs .row:nth-child(3){animation-delay:160ms}
}
</style>
</head>
<body>
<div class="bgfx" aria-hidden="true"><i class="o1"></i><i class="o2"></i><i class="o3"></i><span class="grid"></span></div>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"></span>Maddox<b>&nbsp;Gym</b></div>
    <div class="sync" id="sync"><i></i><span>Conectando…</span></div>
  </header>
  <main id="app"><div class="empty">Cargando tu plan…</div></main>
</div>
<div id="dock" hidden></div>
<div id="sheet"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<nav class="tabs" aria-label="Secciones">
  <span class="tab-ind" id="tabInd" aria-hidden="true"></span>
  <button data-tab="inicio" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Inicio</button>
  <button data-tab="rutinas"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Rutinas</button>
  <button data-tab="entrenar" class="mid"><span class="orb"><svg viewBox="0 0 24 24"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg></span>Entrenar<span class="live" id="liveDot" hidden></span></button>
  <button data-tab="progreso"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progreso</button>
  <button data-tab="perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Perfil</button>
</nav>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const DIAS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const DL=['L','M','X','J','V','S','D'];
const DLARGO=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
const GRUPOS=['Pecho','Espalda','Hombros','Bíceps','Tríceps','Piernas','Glúteos','Core','Cardio','Otro'];
const nf=n=>Number(n).toLocaleString('es-CO',{maximumFractionDigits:1});
const toNum=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isNaN(n)?null:n};
const dayIdx=d=>(d.getDay()+6)%7;
const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const fDate=iso=>new Date(iso).toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'});
const fShort=iso=>{const d=new Date(iso);return d.getDate()+'/'+(d.getMonth()+1)};
const norm=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const e1rm=(p,r)=>r>0?p*(1+r/30):p;
const topReps=r=>{const m=String(r).match(/\d+/g);return m?+m[m.length-1]:10};
const IC={
  play:'<svg class="i" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>',
  clock:'<svg class="i" viewBox="0 0 24 24" style="width:15px;height:15px"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  cal:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  chev:'<svg class="i" viewBox="0 0 24 24" style="color:var(--faint)"><path d="M9 6l6 6-6 6"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  bolt:'<svg class="i" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
  flame:'<svg class="i" viewBox="0 0 24 24"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5 .3 2 1.5 3 2.5 3-1-3 0-6 0-8z"/></svg>',
  dumb:'<svg class="i" viewBox="0 0 24 24"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>',
  trophy:'<svg class="i" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4v1a3 3 0 0 0 4 3M16 6h4v1a3 3 0 0 1-4 3M12 13v4M8 21h8M9 17h6"/></svg>'
};

const GL='<span class="gloss" aria-hidden="true"></span>';
const cnt=(v,pre='')=>`<span data-count="${v}" data-pre="${pre}">${pre}${nf(v)}</span>`;
let animNext=true;
const S={mode:'loading',plan:null,planLoaded:false,sesiones:[],medidas:[],tab:'inicio',sub:'ejercicios',progEj:null,editor:null,open:null,confirm:null,notice:'',summary:null,msg:''};
let base=null;
const cfg=()=>({meta:4,descanso:90,sonido:true,...(S.plan&&S.plan.config||{})});

/* ---------- borrador de sesión (este dispositivo) ---------- */
let draft=null;
try{draft=JSON.parse(localStorage.getItem('maddoxgym-draft')||'null')}catch(e){}
let saveT=null;
function saveDraft(now){
  clearTimeout(saveT);
  const w=()=>{try{draft?localStorage.setItem('maddoxgym-draft',JSON.stringify(draft)):localStorage.removeItem('maddoxgym-draft')}catch(e){}};
  now?w():saveT=setTimeout(w,300);
}
const elapsed=()=>!draft?0:draft.acc+(draft.runStart?Date.now()-draft.runStart:0);
const p2=n=>String(n).padStart(2,'0');
function fClock(ms){const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return h?h+':'+p2(m)+':'+p2(s):p2(m)+':'+p2(s)}
function fRest(ms){const t=Math.max(0,Math.ceil(ms/1000));return Math.floor(t/60)+':'+p2(t%60)}

/* sonido del descanso */
let AC=null;
function ensureAudio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}
function beep(){try{if(!AC)return;const t=AC.currentTime;[0,.28,.56].forEach((o,i)=>{const os=AC.createOscillator(),g=AC.createGain();os.frequency.value=i===2?1175:880;g.gain.setValueAtTime(.0001,t+o);g.gain.exponentialRampToValueAtTime(.35,t+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t+o+.22);os.connect(g).connect(AC.destination);os.start(t+o);os.stop(t+o+.24)})}catch(e){}}

const RC=2*Math.PI*22;
setInterval(()=>{
  if(!draft)return;
  document.querySelectorAll('[data-clock]').forEach(e=>e.textContent=fClock(elapsed()));
  const r=draft.rest;if(!r)return;
  const rem=r.end-Date.now();
  if(rem<=0&&!r.done){r.done=true;saveDraft(true);if(cfg().sonido)beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}renderDock();return}
  if(r.done&&rem<-8000){draft.rest=null;saveDraft(true);renderDock();return}
  const t=$('#restT'),f=$('#ringFg');
  if(t)t.textContent=fRest(rem);
  if(f)f.style.strokeDashoffset=(RC*(1-Math.max(0,rem)/r.total)).toFixed(2);
},250);

/* ---------- almacenamiento ---------- */
function loadLocal(){
  try{const d=JSON.parse(localStorage.getItem('maddoxgym-data')||'null');if(d){S.plan=d.plan;S.sesiones=d.sesiones||[];S.medidas=d.medidas||[]}}catch(e){}
  S.planLoaded=true;
}
function saveLocal(){try{localStorage.setItem('maddoxgym-data',JSON.stringify({plan:S.plan,sesiones:S.sesiones,medidas:S.medidas}))}catch(e){}}
async function write(fnCloud,fnLocal){
  try{if(S.mode==='cloud')await fnCloud();else{fnLocal();saveLocal()}return true}
  catch(e){S.notice=e&&e.code==='quota_exceeded'?'Se llenó el espacio de almacenamiento. Borra sesiones antiguas para seguir guardando.':'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.';render();return false}
}
const savePlan=p=>{S.plan=p;return write(()=>base.set(p),()=>{})};
const saveConfig=patch=>{const p=clone(S.plan);p.config={...cfg(),...patch};return savePlan(p)};
const addSesion=s=>write(()=>base.collection('sesiones').doc(s.id).set(s),()=>{S.sesiones.unshift(s)});
const delSesion=id=>write(()=>base.collection('sesiones').doc(id).delete(),()=>{S.sesiones=S.sesiones.filter(x=>x.id!==id)});
const addMedida=m=>write(()=>base.collection('medidas').doc(m.id).set(m),()=>{S.medidas.unshift(m)});
const delMedida=id=>write(()=>base.collection('medidas').doc(id).delete(),()=>{S.medidas=S.medidas.filter(x=>x.id!==id)});

async function init(){
  let c=null;
  for(let i=0;i<(window.claude?20:0)&&!c;i++){if(window.claude&&window.claude.use)c=window.claude;else await new Promise(r=>setTimeout(r,100))}
  let db=null,user=null,uid=null;
  if(c){try{[db,user]=await Promise.all([c.use('db'),c.use('user')])}catch(e){}}
  if(user){try{uid=await user.id()}catch(e){}}
  if(db&&uid){S.mode='cloud';base=db.doc('data/users/'+uid+'/plan');subscribe()}
  else{S.mode='local';loadLocal();render()}
}
function subscribe(){
  const t=setTimeout(()=>{if(!S.planLoaded){S.notice='Todavía no se pudo conectar. Tus datos aparecerán cuando vuelva la conexión.';render()}},10000);
  const onErr=()=>{clearTimeout(t);S.planLoaded=true;S.notice='Se perdió la conexión con tus datos. Recarga la página más tarde.';render()};
  base.onSnapshot(snap=>{if(!snap.metadata.fromCache){clearTimeout(t);S.notice=''}S.plan=snap.exists?clone(snap.data()):null;S.planLoaded=true;soft()},onErr);
  base.collection('sesiones').orderBy('fecha','desc').onSnapshot(q=>{S.sesiones=q.docs.map(d=>({...clone(d.data()),id:d.id}));soft()},onErr);
  base.collection('medidas').orderBy('fecha','desc').onSnapshot(q=>{S.medidas=q.docs.map(d=>({...clone(d.data()),id:d.id}));soft()},onErr);
}
function soft(){if(S.editor)return;if(S.tab==='entrenar'&&draft&&S.planLoaded&&$('.sess'))return;render()}

/* ---------- datos derivados ---------- */
const ejById=id=>((S.plan&&S.plan.ejercicios)||[]).find(e=>e.id===id);
const ejName=id=>(ejById(id)||{}).nombre||'Ejercicio';
function prevMax(ejId){let m=null;for(const s of S.sesiones)for(const it of s.items||[])if(it.ejId===ejId)for(const st of it.sets)if(m===null||st.peso>m)m=st.peso;return m}
const bestOf=sets=>sets.reduce((a,x)=>x.peso>a.peso||(x.peso===a.peso&&x.reps>a.reps)?x:a);
function lastPerf(ejId){for(const s of S.sesiones)for(const it of s.items||[])if(it.ejId===ejId&&it.sets.length)return{best:bestOf(it.sets),sets:it.sets,fecha:s.fecha};return null}
function history(ejId){
  return S.sesiones.slice().reverse().flatMap(s=>(s.items||[]).filter(it=>it.ejId===ejId&&it.sets.length).map(it=>{
    const b=bestOf(it.sets);return{fecha:s.fecha,max:b.peso,reps:b.reps,e1:Math.max(...it.sets.map(x=>e1rm(x.peso,x.reps))),sets:it.sets}}));
}
function lastDone(rid){const s=S.sesiones.find(x=>x.rutinaId===rid);return s?new Date(s.fecha).getTime():0}
function ago(ts){if(!ts)return'aún no la haces';const a=new Date();a.setHours(0,0,0,0);const b=new Date(ts);b.setHours(0,0,0,0);const n=Math.round((a-b)/864e5);return n<=0?'hoy':n===1?'ayer':'hace '+n+' días'}
function todayPick(){
  const rs=S.plan.rutinas;if(!rs.length)return null;
  const now=new Date(),t=dayIdx(now),doneToday=S.sesiones.some(s=>sameDay(new Date(s.fecha),now));
  if(!doneToday){const r=rs.find(x=>x.dias.includes(t));if(r)return{r,kicker:'Hoy te toca'}}
  for(let k=1;k<7;k++){const d=(t+k)%7,r=rs.find(x=>x.dias.includes(d));if(r)return{r,kicker:(k===1?'Mañana te toca':'Próxima, el '+DLARGO[d])}}
  return{r:rs.slice().sort((a,b)=>lastDone(a.id)-lastDone(b.id))[0],kicker:doneToday?'Para tu próxima sesión':'Sugerida para hoy'};
}
function weekStart(d){const m=new Date(d);m.setHours(0,0,0,0);m.setDate(m.getDate()-dayIdx(m));return m}
function daysTrainedIn(ws){const we=new Date(ws);we.setDate(we.getDate()+7);const set=new Set();for(const s of S.sesiones){const d=new Date(s.fecha);if(d>=ws&&d<we)set.add(d.toDateString())}return set.size}
function weekStreak(){
  const meta=cfg().meta;let ws=weekStart(new Date()),n=0;
  if(daysTrainedIn(ws)>=meta)n++;
  for(let i=0;i<260;i++){ws.setDate(ws.getDate()-7);if(daysTrainedIn(ws)>=meta)n++;else break}
  return n;
}
function bestGain(){
  const ids=new Set();for(const s of S.sesiones)for(const it of s.items||[])ids.add(it.ejId);
  let best=null;
  for(const id of ids){const h=history(id);if(h.length<2)continue;const d=h[h.length-1].max-h[0].max;
    if(d>0&&(!best||d>best.d)){const wk=Math.max(1,Math.round((new Date(h[h.length-1].fecha)-new Date(h[0].fecha))/6048e5));best={id,d,wk,bars:h.slice(-6).map(x=>x.max)}}}
  return best;
}
function suggest(it){
  const lp=lastPerf(it.ejId),top=topReps(it.reps),g=(ejById(it.ejId)||{}).grupo;
  if(!lp)return{tipo:'nuevo',t:'Primera vez',d:'Busca un peso con el que llegues justo a '+top+' reps.'};
  const b=lp.best,allTop=lp.sets.every(s=>s.reps>=top);
  if(b.peso===0)return{tipo:allTop?'sube':'repite',t:'Intenta '+(b.reps+1)+' reps',d:'Hiciste '+b.reps+' reps la vez pasada.'};
  if(allTop){const inc=['Piernas','Glúteos'].includes(g)?5:2.5,p=b.peso+inc;return{tipo:'sube',peso:p,t:'Sube a '+nf(p)+' kg',d:'Hiciste '+nf(b.peso)+' × '+b.reps+' la vez pasada.'}}
  return{tipo:'repite',t:'Repite '+nf(b.peso)+' kg',d:'Busca '+top+' reps en todas las series. La última vez: '+lp.sets.map(s=>s.reps).join(', ')+'.'};
}
function nextSet(){if(!draft)return null;for(const it of draft.items)for(let j=0;j<it.sets.length;j++)if(!it.sets[j].ok)return it.nombre+' · serie '+(j+1);return null}

function buildTemplate(){
  const defs=[
    {nombre:'Día de empuje',dias:[0,3],items:[['Press de banca','Pecho',4,'8'],['Press inclinado con mancuernas','Pecho',3,'10'],['Press militar','Hombros',3,'10'],['Elevaciones laterales','Hombros',3,'15'],['Extensión de tríceps en polea','Tríceps',3,'12']]},
    {nombre:'Día de jalón',dias:[1,4],items:[['Peso muerto','Espalda',3,'5'],['Dominadas','Espalda',4,'8'],['Remo con barra','Espalda',4,'8'],['Face pull','Hombros',3,'15'],['Curl con barra','Bíceps',3,'10']]},
    {nombre:'Día de pierna',dias:[2,5],items:[['Sentadilla','Piernas',4,'6'],['Prensa','Piernas',3,'10'],['Peso muerto rumano','Glúteos',3,'8'],['Curl femoral','Piernas',3,'12'],['Elevación de pantorrilla','Piernas',4,'15']]}
  ];
  const ejercicios=[],rutinas=[],hoy=new Date().toISOString();
  for(const d of defs)rutinas.push({id:gid(),nombre:d.nombre,dias:d.dias,creada:hoy,items:d.items.map(([n,g,s,r])=>{const e={id:gid(),nombre:n,grupo:g};ejercicios.push(e);return{ejId:e.id,series:s,reps:r}})});
  return{ejercicios,rutinas,config:{meta:6,descanso:90,sonido:true}};
}

  const sy=$('#sync');sy.classList.toggle('on',S.mode==='cloud');
  sy.querySelector('span').textContent=S.mode==='cloud'?'En tu cuenta':S.mode==='local'?'En este navegador':'Conectando…';
  let h='';

}

function vSession(){
  const d=draft,running=!!d.runStart;
  const tot=d.items.reduce((a,it)=>a+it.sets.length,0),ok=d.items.reduce((a,it)=>a+it.sets.filter(s=>s.ok).length,0);
  let h=`<section class="card sess tilt" style="margin-top:12px">${GL}<div class="kicker">${esc(d.rutinaNombre)}</div>
    <div class="clock${running?'':' paused'}" data-clock>${fClock(elapsed())}</div>
    <div class="faint small">${running?'Tiempo de sesión':'Cronómetro en pausa'}</div>
    <div class="row">
      <button class="btn${running?' ghost':''} sm" data-act="toggleTimer">${running?'Pausar':'Reanudar'}</button>
      ${S.confirm==='reset'?`<button class="btn sm danger" data-act="resetTimer">Volver a 00:00</button><button class="btn sm ghost" data-act="noConfirm">No</button>`:`<button class="btn ghost sm" data-act="ask" data-c="reset">Reiniciar</button>`}
    </div>
    <div class="meter" aria-hidden="true"><i id="meter" style="transform:scaleX(${tot?ok/tot:0})"></i></div>
    <div class="small muted" style="margin-top:6px"><span id="setCount">${ok}</span> de ${tot} series hechas</div></section>`;
  h+=`<div class="stack" style="margin-top:10px">`+d.items.map((it,i)=>{
    const pm=prevMax(it.ejId),sg=suggest(it),applied=sg.peso&&it.sets.every(s=>toNum(s.peso)===sg.peso);
    return `<section class="card ex"><div class="ex-head"><div><div class="ex-name">${esc(it.nombre)}</div><div class="muted small">Objetivo <span class="num">${it.series} × ${esc(it.reps)}</span>${pm!==null?` · Récord <span class="num">${nf(pm)} kg</span>`:''}</div></div>
      <button class="icon-btn" data-act="rmItem" data-i="${i}" aria-label="Quitar ${esc(it.nombre)} de esta sesión">×</button></div>
      <div class="sug${sg.tipo==='sube'?' lift':''}"><div><div class="k">Hoy</div><div class="t">${esc(sg.t)}</div><div class="d">${esc(sg.d)}</div></div>
        ${sg.peso&&!applied?`<button class="btn sm" data-act="useSug" data-i="${i}" data-p="${sg.peso}">Usar</button>`:''}</div>
      <div class="sets"><div class="set-h"><span>#</span><span>Peso kg</span><span>Reps</span><span></span></div>
      ${it.sets.map((s,j)=>{const p=toNum(s.peso),isPR=pm!==null&&p!==null&&p>pm;
        return `<div class="set${s.ok?' ok':''}${isPR?' isPR':''}"><span class="n">${j+1}</span>
        <input id="p-${i}-${j}" inputmode="decimal" enterkeyhint="next" autocomplete="off" aria-label="Peso serie ${j+1}" data-set="${i},${j},peso" value="${esc(s.peso)}" placeholder="0">
        <input id="r-${i}-${j}" inputmode="numeric" enterkeyhint="next" autocomplete="off" aria-label="Repeticiones serie ${j+1}" data-set="${i},${j},reps" value="${esc(s.reps)}" placeholder="0">
        <button class="chk" data-act="tick" data-i="${i}" data-j="${j}" aria-label="Marcar serie ${j+1} como hecha" aria-pressed="${!!s.ok}">${IC.check}</button></div>`}).join('')}
      </div>
      <div class="row"><button class="btn ghost sm" data-act="addSet" data-i="${i}">+ Serie</button>${it.sets.length?`<button class="btn ghost sm" data-act="rmSet" data-i="${i}">− Serie</button>`:''}</div></section>`}).join('')+`</div>`;
  const extra=(S.plan.ejercicios||[]).filter(e=>!d.items.some(it=>it.ejId===e.id));
  if(extra.length)h+=`<section class="card" style="margin-top:10px"><label for="addEx">Añadir otro ejercicio a esta sesión</label>
    <div class="row" style="margin-top:8px;flex-wrap:nowrap"><select id="addEx">${extra.map(e=>`<option value="${e.id}">${esc(e.nombre)}</option>`).join('')}</select><button class="btn sm" data-act="addEx">Añadir</button></div></section>`;
  h+=`<p class="err" style="margin-top:14px">${esc(S.msg)}</p><div class="row" style="margin-top:10px">
    ${S.confirm==='discard'?`<span class="small" style="flex:1">¿Descartar sin guardar?</span><button class="btn sm danger" data-act="discard">Descartar</button><button class="btn sm ghost" data-act="noConfirm">No</button>`
      :`<button class="btn ghost" data-act="ask" data-c="discard">Descartar</button><button class="btn" style="flex:1" data-act="finish">Terminar y guardar</button>`}</div>`;
  return h;
}

let dockOn=false;
function renderDock(){
  const el=$('#dock'),r=draft&&draft.rest;
  document.body.classList.toggle('has-dock',!!r);
  if(!r){el.hidden=true;el.innerHTML='';dockOn=false;return}
  if(!dockOn){
    el.innerHTML=`<div class="dock-in enter" role="status"><div class="ringw"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="22" class="ring-bg"/><circle id="ringFg" cx="28" cy="28" r="22" class="ring-fg" stroke-dasharray="${RC.toFixed(2)}"/></svg><span class="ring-t" id="restT"></span></div>
      <div class="dock-txt"><div class="eyebrow" id="dockK"></div><div class="small" id="dockS"></div></div>
      <div class="dock-act"><button class="icon-btn" data-act="restAdd" data-s="-15" aria-label="Quitar 15 segundos">−15</button><button class="icon-btn" data-act="restAdd" data-s="15" aria-label="Sumar 15 segundos">+15</button><button class="icon-btn" data-act="restSkip" aria-label="Cerrar descanso">×</button></div></div>`;
    el.hidden=false;dockOn=true;
  }
  const rem=r.end-Date.now(),done=r.done||rem<=0,nx=nextSet();
  el.firstElementChild.classList.toggle('done',done);
  $('#restT').textContent=fRest(rem);
  $('#ringFg').style.strokeDashoffset=(RC*(1-Math.max(0,rem)/r.total)).toFixed(2);
  $('#dockK').textContent=done?'Descanso terminado':'Descanso';
  $('#dockS').textContent=done?(nx?'Sigue: '+nx:'Terminaste todas las series'):(nx?'Luego: '+nx:'Última serie hecha');
}

function chart(pts,{unit='kg',prIdx=-1}={}){
  if(pts.length<2)return `<p class="muted small" style="margin:6px 0">Registra al menos dos veces para ver la línea de progreso.</p>`;
  const W=340,H=170,L=38,R=12,T=14,B=24,vs=pts.map(p=>p.v);
  let mn=Math.min(...vs),mx=Math.max(...vs);if(mn===mx){mn-=5;mx+=5}const pad=(mx-mn)*.12;mn=Math.max(0,mn-pad);mx+=pad;
  const x=i=>L+i*(W-L-R)/(pts.length-1),y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  const ticks=[mn,(mn+mx)/2,mx].map(v=>Math.round(v*2)/2);
  const line=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const area=line+` L${x(pts.length-1).toFixed(1)} ${H-B} L${L} ${H-B} Z`,last=pts.length-1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progreso de ${pts.length} registros, de ${nf(pts[0].v)} a ${nf(pts[last].v)} ${unit}">

    <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5683DA" stop-opacity=".35"/><stop offset="1" stop-color="#5683DA" stop-opacity="0"/></linearGradient><linearGradient id="cl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5683DA"/><stop offset="1" stop-color="#FF8964"/></linearGradient></defs><path class="carea" d="${area}" fill="url(#cg)"/>
    <path class="cline" pathLength="1" d="${line}" fill="none" stroke="url(#cl)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle class="cpt" style="animation-delay:${300+i*45}ms" cx="${x(i)}" cy="${y(p.v)}" r="${i===last||i===prIdx?5:2.8}" style="fill:${i===prIdx?'var(--ember)':i===last?'var(--fg)':'var(--iris)'};stroke:var(--card);stroke-width:${i===prIdx||i===last?2:0}"/>`).join('')}
    <text x="${L}" y="${H-6}" font-size="10" style="fill:var(--faint)">${fShort(pts[0].fecha)}</text>
    <text x="${W-R}" y="${H-6}" font-size="10" text-anchor="end" style="fill:var(--faint)">${fShort(pts[last].fecha)}</text></svg>`;
}
function platesHtml(w){

async function saveEditor(){
  const e=S.editor,items=e.items.filter(it=>String(it.nombre).trim());
  if(!e.nombre.trim()){e.err='Ponle un nombre a la rutina.';renderSheet();return}
  if(!items.length){e.err='Añade al menos un ejercicio con nombre.';renderSheet();return}
  const plan=clone(S.plan||{ejercicios:[],rutinas:[]});
  const resolved=items.map(it=>{
    const nombre=it.nombre.trim();
    let ex=it.ejId&&plan.ejercicios.find(x=>x.id===it.ejId);
    if(ex&&norm(ex.nombre)!==norm(nombre)){const o=plan.ejercicios.find(x=>norm(x.nombre)===norm(nombre));if(o)ex=o;else ex.nombre=nombre}
    if(!ex)ex=plan.ejercicios.find(x=>norm(x.nombre)===norm(nombre));
    if(!ex){ex={id:gid(),nombre,grupo:it.grupo};plan.ejercicios.push(ex)}
    ex.grupo=it.grupo;
    return{ejId:ex.id,series:Math.max(1,parseInt(it.series)||3),reps:String(it.reps||'10').trim()||'10'};
  });
  const r={id:e.id||gid(),nombre:e.nombre.trim(),dias:e.dias.slice().sort(),items:resolved};
  const i=plan.rutinas.findIndex(x=>x.id===r.id);
  if(i>=0){r.creada=plan.rutinas[i].creada;plan.rutinas[i]=r}else{r.creada=new Date().toISOString();plan.rutinas.push(r)}
  S.editor=null;await savePlan(plan);render();
}

/* ---------- sesión ---------- */
function mkItem(ejId,series,reps){
  const lp=lastPerf(ejId);
  return{ejId,nombre:ejName(ejId),series,reps,sets:Array.from({length:series},(_,j)=>{const ls=lp&&(lp.sets[j]||lp.sets[lp.sets.length-1]);return{peso:ls?String(ls.peso).replace('.',','):'',reps:String(parseInt(reps)||''),ok:false}})};
}
function startSession(rid){
  const r=S.plan.rutinas.find(x=>x.id===rid);if(!r)return;
  draft={rutinaId:r.id,rutinaNombre:r.nombre,acc:0,runStart:Date.now(),rest:null,items:r.items.map(it=>mkItem(it.ejId,it.series,it.reps))};
  S.summary=null;S.msg='';S.confirm=null;S.tab='entrenar';animNext=true;saveDraft(true);render();window.scrollTo(0,0);
}
async function finish(){
  const items=draft.items.map(it=>({ejId:it.ejId,nombre:it.nombre,sets:it.sets.map(s=>({peso:toNum(s.peso)??0,reps:parseInt(s.reps)||0})).filter(s=>s.reps>0)})).filter(it=>it.sets.length);
  if(!items.length){S.msg='Registra al menos una serie con repeticiones para guardar la sesión.';render();return}
  const prs=[];let vol=0,n=0;
  for(const it of items){const pm=prevMax(it.ejId),mx=Math.max(...it.sets.map(s=>s.peso));if(pm!==null&&mx>pm)prs.push(it.nombre);for(const s of it.sets){vol+=s.peso*s.reps;n++}}
  const ses={id:gid(),fecha:new Date().toISOString(),rutinaId:draft.rutinaId,rutinaNombre:draft.rutinaNombre,duracion:Math.round(elapsed()/1000),items,volumen:Math.round(vol),series:n,prs};
  if(!await addSesion(ses))return;
  draft=null;saveDraft(true);S.summary={...ses,fresh:true};S.msg='';render();window.scrollTo(0,0);confetti(innerWidth/2,innerHeight*.28,prs.length?160:90);
}
function updateCount(){
  if(!draft)return;const tot=draft.items.reduce((a,it)=>a+it.sets.length,0),ok=draft.items.reduce((a,it)=>a+it.sets.filter(s=>s.ok).length,0);
  const c=$('#setCount'),m=$('#meter');if(c)c.textContent=ok;if(m)m.style.transform='scaleX('+(tot?ok/tot:0)+')';
}

    saveDraft(true);updateCount();renderDock()},
  useSug:d=>{draft.items[+d.i].sets.forEach(s=>{if(!s.ok)s.peso=String(d.p).replace('.',',')});saveDraft();render()},
  restAdd:d=>{const r=draft.rest;if(!r)return;if(r.done||r.end<Date.now()){r.end=Date.now();r.done=false}r.end+=(+d.s)*1000;r.total=Math.max(r.total,r.end-Date.now());saveDraft(true);renderDock()},
  restSkip:()=>{draft.rest=null;saveDraft(true);renderDock()},
  addSet:d=>{const it=draft.items[+d.i],l=it.sets[it.sets.length-1];it.sets.push({peso:l?l.peso:'',reps:l?l.reps:String(parseInt(it.reps)||''),ok:false});saveDraft();render()},
  rmSet:d=>{draft.items[+d.i].sets.pop();saveDraft();render()},
  rmItem:d=>{draft.items.splice(+d.i,1);saveDraft();render()},
  addEx:()=>{const id=$('#addEx').value;if(!id)return;draft.items.push(mkItem(id,3,'10'));saveDraft();render()},
  discard:()=>{draft=null;S.confirm=null;S.msg='';saveDraft(true);render()},
  finish:()=>finish(),
  closeSummary:()=>{S.summary=null;render()},
  sub:d=>{animNext=true;S.sub=d.s;S.confirm=null;render()},
  pickEj:d=>{animNext=true;S.progEj=d.id;render()},
  toggleH:d=>{S.open=S.open===d.id?null:d.id;S.confirm=null;render()},
  delSes:async d=>{S.confirm=null;S.open=null;await delSesion(d.id);render()},
  delBw:async d=>{await delMedida(d.id);render()},
  meta:async d=>{const v=Math.min(7,Math.max(1,cfg().meta+ +d.d));await saveConfig({meta:v});render()},
  rest:async d=>{await saveConfig({descanso:+d.s});render()},
  exportData:async()=>{
    const text=JSON.stringify({app:'maddox-gym',v:1,exportado:new Date().toISOString(),plan:S.plan,sesiones:S.sesiones,medidas:S.medidas});
    let ok=false;try{await navigator.clipboard.writeText(text);ok=true}catch(e){}
    S.bk={mode:'export',text,msg:ok?'Datos copiados. En la otra app ve a Perfil, Importar datos, y pégalos.':'Mantén presionado el texto, selecciónalo todo y cópialo.'};render();
    if(!ok)setTimeout(()=>{const t=$('#bkText');if(t){t.focus();t.select()}},50);
  },
  showImport:()=>{S.bk={mode:'import',text:'',msg:''};render();setTimeout(()=>{const t=$('#bkText');t&&t.focus()},50)},
  doImport:()=>doImport(),
  sound:async()=>{ensureAudio();const v=!cfg().sonido;await saveConfig({sonido:v});if(v)beep();render()},
};
document.addEventListener('click',ev=>{
  const tab=ev.target.closest('.tabs button');
  if(tab){animNext=true;S.tab=tab.dataset.tab;S.confirm=null;S.msg='';render();window.scrollTo(0,0);return}
  const b=ev.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='sheetBg'&&ev.target!==b)return;
  A[b.dataset.act]&&A[b.dataset.act](b.dataset,b,ev);
});
function onField(ev){
  const t=ev.target;
  if(t.dataset.set&&draft){const[i,j,f]=t.dataset.set.split(',');const it=draft.items[+i];it.sets[+j][f]=t.value;saveDraft();
    if(f==='peso'){const pm=prevMax(it.ejId),p=toNum(t.value);t.closest('.set').classList.toggle('isPR',pm!==null&&p!==null&&p>pm)}}
  else if(t.dataset.ed&&S.editor)S.editor[t.dataset.ed]=t.value;
  else if(t.dataset.edi&&S.editor){const[i,f]=t.dataset.edi.split(',');S.editor.items[+i][f]=t.value}
  else if(t.id==='bw'){const e=$('#bwErr');if(e)e.textContent=''}
}
document.addEventListener('focusin',ev=>{const t=ev.target;if(t.dataset&&t.dataset.set)setTimeout(()=>{try{t.select()}catch(e){}},0)});
document.addEventListener('keydown',ev=>{const t=ev.target;if(ev.key==='Enter'&&t.dataset&&t.dataset.set){ev.preventDefault();const all=[...document.querySelectorAll('[data-set]')],n=all[all.indexOf(t)+1];n?n.focus():t.blur()}});
document.addEventListener('input',onField);document.addEventListener('change',onField);
document.addEventListener('submit',async ev=>{
  if(ev.target.id!=='bwForm')return;ev.preventDefault();
  const v=toNum($('#bw').value);
  if(v===null||v<25||v>350){$('#bwErr').textContent='Escribe tu peso en kg, por ejemplo 72,5.';return}
  await addMedida({id:gid(),fecha:new Date().toISOString(),peso:v});render();
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.editor){S.editor=null;render()}});

/* ---------- copia de seguridad ---------- */
async function doImport(){
  const ta=$('#bkText');const raw=ta?ta.value.trim():'';let d=null;
  try{d=JSON.parse(raw)}catch(e){}
  if(!d||d.app!=='maddox-gym'||!d.plan||!Array.isArray(d.plan.rutinas)){S.bk={mode:'import',text:raw,msg:'Ese texto no es una copia de Maddox Gym. Pega el texto completo que copiaste.',err:true};render();return}
  const ses=Array.isArray(d.sesiones)?d.sesiones.filter(x=>x&&x.id):[],med=Array.isArray(d.medidas)?d.medidas.filter(x=>x&&x.id):[];
  S.bk={mode:'import',text:'',msg:'Importando…'};render();
  try{
    if(S.mode==='cloud'){
      await base.set(d.plan);
      for(const x of ses)await base.collection('sesiones').doc(x.id).set(x);
      for(const x of med)await base.collection('medidas').doc(x.id).set(x);
    }else{
      S.plan=d.plan;
      const si=new Set(ses.map(x=>x.id)),mi=new Set(med.map(x=>x.id));
      S.sesiones=[...ses,...S.sesiones.filter(x=>!si.has(x.id))].sort((a,b)=>a.fecha<b.fecha?1:-1);
      S.medidas=[...med,...S.medidas.filter(x=>!mi.has(x.id))].sort((a,b)=>a.fecha<b.fecha?1:-1);
      saveLocal();
    }
    S.bk={mode:'import',text:'',msg:'Listo: '+d.plan.rutinas.length+' rutinas, '+ses.length+' sesiones y '+med.length+' registros de peso importados.'};
  }catch(e){S.bk={mode:'import',text:raw,msg:'No se pudo importar. Revisa tu conexión e inténtalo de nuevo.',err:true}}
  animNext=true;render();
}

/* ---------- profundidad e interacción ---------- */
const RM=matchMedia('(prefers-reduced-motion: reduce)');
function bento(){
  const ws=weekStart(new Date()),we=new Date(ws);we.setDate(we.getDate()+7);
  const vol=S.sesiones.filter(s=>{const d=new Date(s.fecha);return d>=ws&&d<we}).reduce((a,s)=>a+(s.volumen||0),0),big=vol>=10000;
  return `<div class="bento"><div class="tile"><span class="ti">${IC.bolt}</span><b>${cnt(big?Math.round(vol/100)/10:Math.round(vol))}<small>${big?' t':' kg'}</small></b><span>Volumen esta semana</span></div>
    <div class="tile"><span class="ti">${IC.flame}</span><b>${cnt(weekStreak())}</b><span>Semanas en racha</span></div>
    <div class="tile"><span class="ti">${IC.dumb}</span><b>${cnt(S.sesiones.length)}</b><span>Sesiones en total</span></div></div>`;
}
function afterRender(){
  const a=$('#app');
  if(animNext&&!RM.matches){a.classList.remove('enter');void a.offsetWidth;a.classList.add('enter');countUp();clearTimeout(afterRender.t);afterRender.t=setTimeout(()=>a.classList.remove('enter'),1500)}
  animNext=false;bindTilt();moveInd();
}
function countUp(){
  document.querySelectorAll('#app [data-count]').forEach(el=>{
    const v=parseFloat(el.dataset.count),pre=el.dataset.pre||'';if(!isFinite(v)||v===0)return;
    const dec=v%1?1:0,t0=performance.now(),D=900;
    const f=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,4),n=v*e;
      el.textContent=pre+(k<1?n.toLocaleString('es-CO',{minimumFractionDigits:dec,maximumFractionDigits:dec}):nf(v));if(k<1)requestAnimationFrame(f)};
    el.textContent=pre+'0';requestAnimationFrame(f);
  });
}
function bindTilt(){
  if(RM.matches)return;
  document.querySelectorAll('.tilt').forEach(el=>{
    if(el._tilt)return;el._tilt=1;
    const set=(x,y)=>{const r=el.getBoundingClientRect(),px=Math.min(1,Math.max(0,(x-r.left)/r.width)),py=Math.min(1,Math.max(0,(y-r.top)/r.height));
      el.style.setProperty('--gx',(px*100).toFixed(1)+'%');el.style.setProperty('--gy',(py*100).toFixed(1)+'%');
      el.classList.add('lit')};
    const off=()=>{el._down=false;el.classList.remove('lit')};
    el.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||el._down)set(e.clientX,e.clientY)},{passive:true});
    el.addEventListener('pointerdown',e=>{el._down=true;set(e.clientX,e.clientY)},{passive:true});
    ['pointerup','pointerleave','pointercancel'].forEach(n=>el.addEventListener(n,off,{passive:true}));
  });
}
function moveInd(){
  const ind=$('#tabInd'),b=document.querySelector('.tabs button[aria-current="page"]');if(!ind||!b)return;
  if(b.classList.contains('mid')){ind.style.opacity='0';return}
  ind.style.opacity='1';ind.style.transform=`translateX(${b.offsetLeft+(b.offsetWidth-58)/2}px)`;
}
addEventListener('resize',moveInd);
document.addEventListener('pointerdown',e=>{
  if(RM.matches)return;const b=e.target.closest('.btn,.play,.chk,.orb');if(!b)return;
  const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2.2,sp=document.createElement('span');
  sp.className='ripple';sp.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  b.appendChild(sp);setTimeout(()=>sp.remove(),600);
},{passive:true});
const FX={p:[],run:false};
function confetti(x,y,n){
  if(RM.matches)return;const c=$('#fx');if(!c)return;
  const cols=['#5683DA','#86A6E6','#FF8964','#FFAA81','#FFDA9F','#FFFFFF'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=3+Math.random()*8;
    FX.p.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-6,r:Math.random()*6,vr:(Math.random()-.5)*.35,w:5+Math.random()*5,h:8+Math.random()*8,c:cols[Math.random()*cols.length|0],life:1})}
  if(FX.run)return;FX.run=true;
  const dpr=Math.min(2,devicePixelRatio||1);c.width=innerWidth*dpr;c.height=innerHeight*dpr;const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  const step=()=>{ctx.clearRect(0,0,innerWidth,innerHeight);
    FX.p=FX.p.filter(p=>p.life>0&&p.y<innerHeight+40);
    for(const p of FX.p){p.vy+=.28;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life-=.009;
      ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.6));ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.scale(1,Math.cos(p.r*1.7));ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}
    if(FX.p.length)requestAnimationFrame(step);else{FX.run=false;ctx.clearRect(0,0,innerWidth,innerHeight)}};
  requestAnimationFrame(step);
}

render();init();
</script>
